<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poppa's Pizza</title>
    <link rel="icon" href="./imgs/web-icon.png" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <div id="main">
      <div id="header">
        <img
          src="/imgs/pizza-guy.jpg"
          alt="A guy holding a pizza box that is open with the pizza inside"
        />
        <h1>Welcome to Poppa's Pizza!</h1>
        <h2>Serving GRC students for 50 years</h2>
        <hr />
        <p>We make the best pizza ever. Visit us today</p>
        <a id="contact-button" href="#" role="button">Contact us</a>
      </div>
      <form id="pizza-form" action="#" method="GET">
        <!-- Contact Info -->
        <fieldset>
          <legend>Contact Info</legend>
          <label for="fname">First name</label>
          <input type="text" id="fname" name="fname" />

          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" />

          <label for="email">Email</label>
          <input type="email" id="email" name="lname" />
        </fieldset>

        <fieldset>
          <legend>Select Pickup or Delivery</legend>
          <label for="pickup">
            <input type="radio" id="pickup" name="method" value="pickup" />
            Pickup
          </label>

          <label for="delivery">
            <input type="radio" id="delivery" name="method" value="delivery" />
            Delivery
          </label>
        </fieldset>

        <fieldset>
          <legend for="topping">Select Toppings</legend>
          <label for="pepperoni">
            <input type="checkbox" name="topping[]" value="pepperoni" />
            Pepperoni
          </label>
          <label for="mushrooms">
            <input type="checkbox" name="topping[]" value="mushrooms" />
            Mushrooms
          </label>
          <label for="olives">
            <input type="checkbox" name="topping[]" value="olives" />
            Olives
          </label>
        </fieldset>

        <fieldset>
          <legend>Pizza Size</legend>
          <select name="pizza-size" id="pizza-size">
            <option value="none">Select A Size</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </fieldset>

        <label for="comment">Comment</label>
        <textarea rows = "5" name="comment" id="comment"></textarea>

        <button type="submit" id="order-button">Submit</button>
      </form>

    </div>
  </body>
</html>
